<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 24 236 86" width="236" height="86" role="img" aria-label="Perro salchicha con un huesito en la boca" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Perro salchicha con un huesito en la boca</title>

  <!-- Colores: edítalos aquí -->
  <!-- cuerpo #b98d63 | sombra #96704a | hueso #7f9bb0 | ojo y nariz #2b2622 -->

  <!-- Patas del lado lejano (más oscuras) -->
  <g fill="#96704a">
    <rect x="88" y="74" width="14" height="26" rx="7"/>
    <rect x="172" y="74" width="14" height="26" rx="7"/>
  </g>

  <!-- Cola -->
  <path d="M60 58 Q36 54 30 32" fill="none" stroke="#96704a" stroke-width="10" stroke-linecap="round"/>

  <!-- Cuerpo largo -->
  <path fill="#b98d63" d="M58 60 Q58 46 74 46 L170 46 Q186 46 186 60 L186 70 Q186 82 174 82 L70 82 Q58 82 58 70 Z"/>

  <!-- Patas del lado cercano -->
  <g fill="#b98d63">
    <rect x="68" y="74" width="16" height="26" rx="8"/>
    <rect x="154" y="74" width="16" height="26" rx="8"/>
  </g>

  <!-- Cabeza y hocico -->
  <g fill="#b98d63">
    <circle cx="190" cy="50" r="19"/>
    <rect x="196" y="44" width="42" height="21" rx="10.5"/>
  </g>

  <!-- Oreja caída -->
  <path d="M184 38 C172 40 170 70 184 80 C198 72 200 46 192 38 C190 35 186 35 184 38 Z" fill="#96704a"/>

  <!-- Ojo y nariz -->
  <circle cx="205" cy="45" r="3" fill="#2b2622"/>
  <circle cx="235" cy="51" r="5" fill="#2b2622"/>

  <!-- Huesito en la boca -->
  <path fill="#7f9bb0" transform="translate(222 66) rotate(-8) scale(0.62)"
        d="M-17.57-5H17.57A7.5 7.5 0 1 1 29.5 0A7.5 7.5 0 1 1 17.57 5H-17.57A7.5 7.5 0 1 1 -29.5 0A7.5 7.5 0 1 1 -17.57 -5Z"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
