services:
  db:
    image: postgres:17
    container_name: tienda-mascotas-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: shopforpetsdb
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d shopforpetsdb"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: