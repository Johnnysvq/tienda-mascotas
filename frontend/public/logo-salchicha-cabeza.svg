<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 12 104 104" width="104" height="104" role="img" aria-label="Cabeza de perro salchicha" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Cabeza de perro salchicha</title>

  <!-- Colores: edítalos aquí -->
  <!-- cabeza #b98d63 | oreja #96704a | collar #7f9bb0 | hueso de la placa #e9eef2 | ojo y nariz #2b2622 -->

  <!-- Cuello -->
  <rect x="36" y="60" width="36" height="54" rx="14" fill="#b98d63"/>

  <!-- Cabeza y hocico -->
  <g fill="#b98d63">
    <circle cx="56" cy="48" r="26"/>
    <rect x="66" y="46" width="44" height="24" rx="12"/>
  </g>

  <!-- Collar -->
  <rect x="36" y="92" width="36" height="8" fill="#7f9bb0"/>

  <!-- Huesito en la placa del collar -->
  <path fill="#e9eef2" transform="translate(54 108) scale(0.3)"
        d="M-17.57-5H17.57A7.5 7.5 0 1 1 29.5 0A7.5 7.5 0 1 1 17.57 5H-17.57A7.5 7.5 0 1 1 -29.5 0A7.5 7.5 0 1 1 -17.57 -5Z"/>

  <!-- Oreja caída -->
  <path d="M52 24 C34 26 26 66 38 90 C54 86 68 54 62 26 C60 22 55 22 52 24 Z" fill="#96704a"/>

  <!-- Ojo y nariz -->
  <circle cx="78" cy="42" r="3.4" fill="#2b2622"/>
  <circle cx="106" cy="52" r="6" fill="#2b2622"/>
