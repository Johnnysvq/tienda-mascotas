<svg xmlns="http://www.w3.org/2000/svg" viewBox="6 14 108 108" width="108" height="108" role="img" aria-label="Cabeza de perro salchicha vista de frente" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Cabeza de perro salchicha vista de frente</title>

  <!-- Colores: edítalos aquí -->
  <!-- cabeza #b98d63 | hocico #d2ac82 | orejas #96704a | collar #7f9bb0 | placa #e9eef2 | ojos, nariz y boca #2b2622 -->

  <!-- Cuello -->
  <rect x="42" y="78" width="36" height="36" rx="12" fill="#b98d63"/>

  <!-- Cabeza -->
  <ellipse cx="60" cy="54" rx="28" ry="30" fill="#b98d63"/>

  <!-- Hocico -->
  <ellipse cx="60" cy="71" rx="16" ry="14" fill="#d2ac82"/>

  <!-- Collar -->
  <rect x="42" y="92" width="36" height="8" fill="#7f9bb0"/>

  <!-- Huesito en la placa del collar -->
  <path fill="#e9eef2" transform="translate(60 107) scale(0.3)"
        d="M-17.57-5H17.57A7.5 7.5 0 1 1 29.5 0A7.5 7.5 0 1 1 17.57 5H-17.57A7.5 7.5 0 1 1 -29.5 0A7.5 7.5 0 1 1 -17.57 -5Z"/>

  <!-- Orejas caídas (simétricas) -->
  <g fill="#96704a">
    <path d="M40 26 C22 26 12 64 20 94 C34 96 44 66 46 34 Z"/>
    <path d="M80 26 C98 26 108 64 100 94 C86 96 76 66 74 34 Z"/>
  </g>

  <!-- Ojos -->
  <g fill="#2b2622">
    <circle cx="51" cy="48" r="3.6"/>
    <circle cx="69" cy="48" r="3.6"/>
  </g>
  <g fill="#ffffff">
    <circle cx="52.2" cy="46.8" r="1.1"/>
    <circle cx="70.2" cy="46.8" r="1.1"/>
  </g>

  <!-- Nariz y boca -->
  <ellipse cx="60" cy="65" rx="8" ry="5.5" fill="#2b2622"/>
  <path d="M60 70 V75 M52 76 Q60 83 68 76" fill="none" stroke="#2b2622" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
